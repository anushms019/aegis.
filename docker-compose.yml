# AEGIS capture server — local / single-host deployment.
#   docker compose up --build
# Dashboard: http://localhost:8788   ·   Metrics: http://localhost:8788/metrics
services:
  aegis:
    build: .
    image: aegis:latest
    container_name: aegis
    ports:
      - "8788:8788"
    environment:
      HOST: 0.0.0.0
      PORT: "8788"
      # Demo posture: this publishes an UNAUTHENTICATED dashboard on the
      # published port. The server refuses a non-loopback bind with no
      # credentials, so the opt-in is explicit — delete this line and set
      # AEGIS_AUTH_USERS for anything reachable beyond localhost.
      AEGIS_ALLOW_INSECURE: "1"
      # AEGIS_AUTH_USERS: "ops:s3cret:admin,dash:view:viewer"  # example only
      # Opt-in remote JWKS (default-deny). Exact https origins only:
      # JWKS_ALLOWLIST: "https://keys.example.com"
      # JWKS_PINS: "https://keys.example.com=sha256/<base64-spki>"
      # JWKS_PATH: /run/secrets/jwks.json
      NODE_ENV: production
    # Optional: mount a keyring file read-only (see JWKS_PATH above)
    # volumes:
    #   - ./keys/jwks.json:/run/secrets/jwks.json:ro
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
