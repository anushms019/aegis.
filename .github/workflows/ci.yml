name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: test (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Syntax check
        run: node --check server.js && node --check app.js && node --check build.js

      - name: Run test suite
        run: node --test tests/server.test.js tests/verify.test.js tests/jwks.test.js tests/integration.test.js tests/build.test.js

      - name: Verify index.html is in sync with sources
        run: |
          node build.js
          git diff --exit-code -- index.html
